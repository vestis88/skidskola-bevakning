name: Skidskola-bevakning

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      place:
        description: 'Text att leta efter i samlingsplatsen (test: yfjell)'
        default: 'turist'
      notify:
        description: 'Skicka notis vid träff'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bevakning
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Kontrollera bokningssidan
        run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PLACE: ${{ inputs.place || 'turist' }}
          NOTIFY: ${{ github.event_name == 'schedule' || inputs.notify }}

      # GitHub stänger av schemalagda körningar efter 60 dagar utan aktivitet i repot.
      # Det här steget gör en liten commit om den senaste är äldre än 30 dagar.
      - name: Håll schemat vid liv
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 30 ]; then
            date -u +"%Y-%m-%d %H:%M UTC" > heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "Heartbeat: håller schemat aktivt"
            git push
          fi
